- name: Configure Payment Server
  hosts: payment
  become: yes

# 1. Record the exact start time before any work begins
  pre_tasks:
    - name: Record playbook start time
      ansible.builtin.set_fact:
        playbook_start_time: "{{ now(utc=true).strftime('%s') }}"

  tasks:
  - name: Install Python packages
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: installed
    loop:
    - python3
    - gcc
    - python3-devel

  - name: Create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: Create roboshop system user
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app

  - name: Download Payment code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
      dest: /tmp/payment.zip

  - name: Extract Payment code
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: Install dependencies 
    ansible.builtin.pip:
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app

  - name: Copy Payment service
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: deamon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Enable and Start payment
    ansible.builtin.service:
      name: payment
      state: started
      enabled: yes
