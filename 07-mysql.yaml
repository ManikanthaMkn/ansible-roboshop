- name: configure MySQL componant
  hosts: mysql
  become: yes
  
# 1. Record the exact start time before any work begins
  pre_tasks:
    - name: Record playbook start time
      ansible.builtin.set_fact:
        playbook_start_time: "{{ now(utc=true).strftime('%s') }}"

  tasks:
  - name: Install MySQL server
    ansible.builtin.dnf:
      name: mysql-server
      state: installed

  - name: Start MySQL server
    ansible.builtin.service:
      name: mysqld
      state: started
      enabled: yes

  - name: Setup root password
    ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1

# 2. Run this at the very end to calculate and display the total duration
  post_tasks:
    - name: Display total execution time
      vars:
        playbook_end_time: "{{ now(utc=true).strftime('%s') }}"
      ansible.builtin.debug:
        msg: "Total playbook execution time: {{ (playbook_end_time | int) - (playbook_start_time | int) }} seconds."