- name: configure catalogue componant
  hosts: catalogue
  become: yes
  tasks: 
  - name: Disable default nodejs
    ansible.builtin.command: dnf module disable nodejs -y
    
  - name: Enable Nodjs:20
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: Install Nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: Create Roboshop System User
    ansible.builtin.user:
      name: roboshop
      shell: /sbin/nologin
      system: true
      home: /app

  - name: Create app directory
    ansible.builtin.file:
      path: /app
      state: directory
  
  - name: Download Catalogue Code
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
      dest: /tmp/catalogue.zip

  - name: Extract Catalogue Code
    ansible.builtin.unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: Install dependencies
    community.general.npm:
      path: /app

  - name: Copy Catalogue service to System directory
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: Start and Enable Catalogue
    ansible.builtin.service:
      name: catalogue
      state: started
      enabled: yes

  - name: copy mongodb repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: Install Mongodb client
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present
  
  - name: Check Products Loaded or Not
    ansible.builtin.command: mongosh --host mongodb.arohvya.online --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output

  - name: print catalogue output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"

  - name: Load Products data
    ansible.builtin.shell: mongosh --host mongodb.arohvya.online < /app/db/master-data.js
    when: catalogue_outputstdout | int < 0