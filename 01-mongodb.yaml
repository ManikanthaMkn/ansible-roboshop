- name: configuring mongodb server
  become: yes
  hosts: mongodb

# 1. Record the exact start time before any work begins
  pre_tasks:
    - name: Record playbook start time
      ansible.builtin.set_fact:
        playbook_start_time: "{{ now(utc=true).strftime('%s') }}"

  tasks:
  - name: copy mongodb repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: Install mongodb server
    ansible.builtin.dnf:
      name: mongodb-org
      state: present

  - name: start and enable mongodb
    ansible.builtin.service:
      name: mongod
      state: started
      enabled: yes

  - name: allow remote connections
    ansible.builtin.replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: start and enable mongodb
    ansible.builtin.service:
      name: mongod
      state: restarted
      
# 2. Run this at the very end to calculate and display the total duration
  post_tasks:
    - name: Display total execution time
      vars:
        playbook_end_time: "{{ now(utc=true).strftime('%s') }}"
      ansible.builtin.debug:
        msg: "Total playbook execution time: {{ (playbook_end_time | int) - (playbook_start_time | int) }} seconds."
